<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Технический шаблон промо-материала «Концепция строительства».">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1920px;
  background: #0a0a0a;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  position: relative;
}

.bg-glow {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 50% 80%, rgba(255,106,0,0.12) 0%, transparent 50%);
}

.bg-lines {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 400px;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 38px,
    rgba(255,106,0,0.03) 38px,
    rgba(255,106,0,0.03) 40px
  );
}

.brand {
  position: absolute;
  top: 60px;
  left: 60px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 10;
}

.logo {
  width: 60px;
  height: 60px;
}

.brand-text {
  color: #fff;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 1px;
}

.product-image {
  position: absolute;
  top: 200px;
  left: 50%;
  transform: translateX(-50%);
  width: 900px;
  height: 900px;
  object-fit: contain;
  z-index: 5;
  filter: drop-shadow(0 20px 60px rgba(255,106,0,0.2));
}

.content {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 60px;
  z-index: 10;
}

.product-name {
  color: #fff;
  font-size: 56px;
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 20px;
  text-transform: uppercase;
}

.price {
  color: #ff6a00;
  font-size: 72px;
  font-weight: 900;
  margin-bottom: 30px;
}

.specs {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 40px;
}

.spec {
  background: rgba(255,106,0,0.1);
  border: 1px solid rgba(255,106,0,0.3);
  border-radius: 12px;
  padding: 12px 20px;
  color: #fff;
  font-size: 20px;
}

.btn {
  background: #ff6a00;
  color: #fff;
  padding: 20px 40px;
  border-radius: 12px;
  font-size: 24px;
  font-weight: 700;
  text-transform: uppercase;
  display: inline-block;
}

.service-tag {
  position: absolute;
  top: 60px;
  right: 60px;
  background: #ff6a00;
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 600;
  z-index: 10;
}
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-lines"></div>
  
  <div class="brand">
    <svg class="logo" viewBox="0 0 60 60">
      <polygon points="30,2 58,30 30,58 2,30" fill="none" stroke="#ff6a00" stroke-width="3"/>
      <polygon points="30,12 48,30 30,48 12,30" fill="#ff6a00"/>
    </svg>
    <span class="brand-text">КОНЦЕПЦИЯ СТРОИТЕЛЬСТВА</span>
  </div>
  
  %%TAG%%
  
  <img class="product-image" src="%%IMAGE_PATH%%" alt="%%NAME%%">
  
  <div class="content">
    <div class="product-name">%%NAME%%</div>
    <div class="price">%%PRICE%%</div>
    <div class="specs">
      %%SPECS%%
    </div>
    <div class="btn">ЗАКАЗАТЬ</div>
  </div>
</body>
</html>
