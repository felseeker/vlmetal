<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Технический шаблон промо-карточки «Концепция строительства».">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1000px;
  height: 1000px;
  background: #0a0a0a;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  position: relative;
}

.bg-glow {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 50% 70%, rgba(255,106,0,0.15) 0%, transparent 60%);
}

.bg-trees {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 400px;
  height: 300px;
  opacity: 0.08;
}

.brand {
  position: absolute;
  top: 30px;
  left: 40px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10;
}

.logo {
  width: 50px;
  height: 50px;
}

.brand-text {
  color: #fff;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 1px;
}

.product-name {
  position: absolute;
  top: 100px;
  left: 40px;
  right: 40px;
  color: #fff;
  font-size: 48px;
  font-weight: 900;
  line-height: 1.1;
  z-index: 10;
  text-transform: uppercase;
}

.product-image {
  position: absolute;
  top: 200px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 700px;
  max-height: 450px;
  object-fit: contain;
  z-index: 5;
}

.price {
  position: absolute;
  bottom: 120px;
  right: 40px;
  color: #ff6a00;
  font-size: 64px;
  font-weight: 900;
  z-index: 10;
}

.specs {
  position: absolute;
  bottom: 40px;
  left: 40px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}

.spec {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-size: 18px;
}

.spec-icon {
  width: 24px;
  height: 24px;
  fill: #ff6a00;
}

.btn {
  position: absolute;
  bottom: 40px;
  right: 40px;
  background: #ff6a00;
  color: #fff;
  padding: 14px 28px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 700;
  text-transform: uppercase;
  z-index: 10;
}
</style>
</head>
<body>
  <div class="bg-glow"></div>
  
  <div class="brand">
    <svg class="logo" viewBox="0 0 50 50">
      <polygon points="25,2 48,25 25,48 2,25" fill="none" stroke="#ff6a00" stroke-width="3"/>
      <polygon points="25,10 40,25 25,40 10,25" fill="#ff6a00"/>
    </svg>
    <span class="brand-text">КОНЦЕПЦИЯ СТРОИТЕЛЬСТВА</span>
  </div>
  
  <div class="product-name">МАНГАЛ СИЛАЧ 140</div>
  
  <img class="product-image" src="%%IMAGE_PATH%%" alt="Силач 140">
  
  <div class="price">67 900 ₽</div>
  
  <div class="specs">
    <div class="spec">
      <svg class="spec-icon" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="1" fill="none" stroke="#ff6a00" stroke-width="2"/><line x1="7" y1="8" x2="7" y2="4" stroke="#ff6a00" stroke-width="2"/></svg>
      Сталь 4 мм
    </div>
    <div class="spec">
      <svg class="spec-icon" viewBox="0 0 24 24"><path d="M12 2C8 6 4 10 4 14a8 8 0 0016 0c0-4-4-8-8-12z" fill="none" stroke="#ff6a00" stroke-width="2"/></svg>
      Коптильня
    </div>
    <div class="spec">
      <svg class="spec-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#ff6a00" stroke-width="2"/><line x1="12" y1="7" x2="12" y2="12" stroke="#ff6a00" stroke-width="2"/><line x1="12" y1="12" x2="16" y2="14" stroke="#ff6a00" stroke-width="2"/></svg>
      Термоэмаль 1200°C
    </div>
  </div>
  
  <div class="btn">В КОРЗИНУ</div>
</body>
</html>
